06" y="2249.5612">TLS &#183; apenas em wss://</text><text fill="#20242A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="144.5354" x="774.5206" y="2268.6291">TCP &#183; transporte fi&#225;vel</text><line style="stroke:#20242A;stroke-width:1;" x1="770.8806" x2="1007.4237" y1="2158.3236" y2="2158.3236"/><line style="stroke:#20242A;stroke-width:1;" x1="770.8806" x2="1007.4237" y1="2177.3915" y2="2177.3915"/><line style="stroke:#20242A;stroke-width:1;" x1="770.8806" x2="1007.4237" y1="2196.4594" y2="2196.4594"/><line style="stroke:#20242A;stroke-width:1;" x1="770.8806" x2="1007.4237" y1="2215.5273" y2="2215.5273"/><line style="stroke:#20242A;stroke-width:1;" x1="770.8806" x2="1007.4237" y1="2234.5953" y2="2234.5953"/><line style="stroke:#20242A;stroke-width:1;" x1="770.8806" x2="1007.4237" y1="2253.6632" y2="2253.6632"/><line style="stroke:#20242A;stroke-width:1;" x1="770.8806" x2="1007.4237" y1="2272.7311" y2="2272.7311"/><line style="stroke:#20242A;stroke-width:1;" x1="770.8806" x2="770.8806" y1="2158.3236" y2="2272.7311"/><line style="stroke:#20242A;stroke-width:1;" x1="1007.4237" x2="1007.4237" y1="2158.3236" y2="2272.7311"/></g><g class="caption" data-source-line="86"><text fill="#20242A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="535.6941" x="249.3648" y="2308.697">A cria&#231;&#227;o da sess&#227;o no banco e a abertura do WebSocket s&#227;o opera&#231;&#245;es distintas.</text><text fill="#20242A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="765.6855" x="134.3691" y="2327.765">Handshake cl&#225;ssico HTTP/1.1. Se houver proxy/TLS externo, a liga&#231;&#227;o termina nesse servidor e &#233; encaminhada &#224; API.</text><text fill="#20242A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="821.4332" x="106.4952" y="2346.8329">O fluxo termina com o canal pronto: a liga&#231;&#227;o continua aberta. Os comandos da sess&#227;o seguem por HTTP, n&#227;o S