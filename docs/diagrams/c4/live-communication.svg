ngthAdjust="spacing" textLength="34.4119" x="2235.2304" y="1491.1635">HTTP</text><text fill="#20242A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="3.64" x="2273.2822" y="1491.1635">&#160;</text><text fill="#38734D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="8.4287" x="2219.5217" y="1510.2314">&#9472;</text><text fill="#20242A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="3.64" x="2227.9504" y="1510.2314">&#160;</text><text fill="#285237" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="45.3178" x="2235.2304" y="1510.2314">Sess&#227;o</text><text fill="#20242A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="3.64" x="2284.1882" y="1510.2314">&#160;</text><text fill="#71549A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="8.4287" x="2219.5217" y="1529.2993">&#9472;</text><text fill="#20242A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="3.64" x="2227.9504" y="1529.2993">&#160;</text><text fill="#594177" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="72.8277" x="2235.2304" y="1529.2993">WebSocket</text><text fill="#20242A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="3.64" x="2311.6981" y="1529.2993">&#160;</text><line style="stroke:none;stroke-width:1;" x1="2215.8817" x2="2369.8251" y1="1323.6542" y2="1323.6542"/><line style="stroke:none;stroke-width:1;" x1="2215.8817" x2="2369.8251" y1="1342.7221" y2="1342.7221"/><line style="stroke:none;stroke-width:1;" x1="2215.8817" x2="2369.8251" y1="1361.79" y2="1361.79"/><line style="stroke:none;stroke-width:1;" x1="2215.8817" x2="2369.8251" y1="1380.858" y2="1380.858"/><line style="stroke:none;stroke-width:1;" x1="2215.8817" x2="2369.8251" y1="1399.9259" y2="1399.9259"/><line style="stroke:none;stroke-width:1;" x1="2215.8817" x2="2369.8251" y1="1418.9938" y2="1418.9938"/><line style="stroke:none;stroke-width:1;" x1="2215.8817" x2="2369.8251" y1="1438.0617" y2="1438.0617"/><line style="stroke:none;stroke-width:1;" x1="2215.8817" x2="2369.8251" y1="1457.1296" y2="1457.1296"/><line style="stroke:none;stroke-width:1;" x1="2215.8817" x2="2369.8251" y1="1476.1975" y2="1476.1975"/><line style="stroke:none;stroke-width:1;" x1="2215.8817" x2="2369.8251" y1="1495.2655" y2="1495.2655"/><line style="stroke:none;stroke-width:1;" x1="2215.8817" x2="2369.8251" y1="1514.3334" y2="1514.3334"/><line style="stroke:none;stroke-width:1;" x1="2215.8817" x2="2369.8251" y1="1533.4013" y2="1533.4013"/><line style="stroke:none;stroke-width:1;" x1="2215.8817" x2="2215.8817" y1="1323.6542" y2="1533.4013"/><line style="stroke:none;stroke-width:1;" x1="2369.8251" x2="2369.8251" y1="1323.6542" y2="1533.4013"/></g><g class="caption" data-source-line="56"><text fill="#20242A" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="123.2975" x="787.2529" y="1569.3672">Criar uma sess&#227;o:</text><text fill="#20242A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="685.3817" x="914.1905" y="1569.3672">POST .../assessments/{id}/live-sessions &#8594; registo no banco + sessionId. Ainda &#233; um pedido HTTP normal.</text><text fill="#20242A" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="93.0156" x="771.8109" y="1588.4351">Abrir o canal:</text><text fill="#20242A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="746.5477" x="868.4666" y="1588.4351">ao navegar para a p&#225;gina ao vivo, o browser inicia /ws; criar a sess&#227;o no backend n&#227;o abre o WebSocket por si s&#243;.</text><text fill="#20242A" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="263.871" x="727.0322" y="1607.5031">HTTP normal n&#227;o cria sess&#245;es ao vivo.</text><text fill="#20242A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="665.2496" x="994.5432" y="1607.5031">Durante uma sess&#227;o, start/answers/state tamb&#233;m continuam por HTTP; STOMP entrega notifica&#231;&#245;es.</text><text fill="#20242A" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="29.8059" x="736.531" y="1626.571">TCP:</text><text fill="#20242A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="880.3171" x="769.9769" y="1626.571">HTTP pode reutilizar liga&#231;&#245;es; n&#227;o h&#225; necessariamente um novo handshake TCP por pedido. WebSocket mant&#233;m a sua liga&#231;&#227;o aberta.</text></g><?plantuml-src ZLVTJXj75BxtKqpSNXYIs05i84bJoJOc8G8Ch6bKgH8QxmxBYDsTxSoiAOsGUjK7gFe2KI-gNAEgz_MRv4bwpip-pDf0a0pQdTtvpZdVdFETiqzuuaTPmCXtmsvds3qRYZWL2KlqzuqdnQDsksD_0QUXfF7pIwuxciLfH3LJdK3ugdYaEafVHx3eTzjf5aUDXkOwOgIl55DgDn9NvCjlVv9CyuZ_IkT_p_yI914ofX5XnASnJou44QdFHG9BO1ktuKjKa1cVYSP-_yVnwUHiVxGxEJlPU_jkqbffg4kUf1Ii0rJ054j9j-SiIffSuk9Mhz7e1y4eOZ74Dw5Xg_bkCZdAxJUVaM-duL14GhvfVhCp70rs-sPDo839OdrZVREtRTRFHQABrVKNwztrVdDb4TxBdPznIj3KWetHxejHzmuRsriRtPt7sXXIPEe3cth2lsIwRcAqFLhRxIsRs5hhTLy-6CO9Yqg6yBs89soP1Cr-gNRtkiFDb_NTEG5B06M4DO3jtlh6LXsW5fSBKKNWGlHUTjUs4A8nXBWel2zRLspwZ3GFwOo5D10IjZHF6FKHiVcMAUsaeCX8ElyKyeGM-GPG9TBPG6H9GELrYwOSDlUFziX__n8lbJm9oK08tLmX7nkaBA7MXTOfl3XAjAH1cGBDav4t8Hq0wSpM4E6SHreAXUbEVM0C-O9DjXmeILaa24k2LF14mrt00yEefg5wKqlXbGOfVRHB07HwHws1qNX-6sGHM3LU6SSTpta0_xc-nZ0pZTU-HMZQbGkFoHdt6Txk2s0C8IKxbqnTu6KaGf7fUxrqB0aP0iPOXZInNlx3LDDPqI05Zh435a-HAx2HCXbpo2-xuQk6VixWi05C0Sg09hv0lirYOV8uVyCnDvISIZG6h6jxvGD45i7DOunIetjOhCZRZ4RS2R5VFdGjubvZACsc4T3-IACtpjb7VCO0obGVs2gIsG0jQEpIoQDByCGf3iXSLTPnSn-mFVjExZN25gbTyOKvRwvumlry4R83h80ELL4iIMITFyE1kW3a8yi6L32U6vl1Ks5OpEkllpiPdPmDnmS7UnDSFXIQdyC6GjFvhIBGd6RqQtPB0YMZaUOnaZY1FYS8Bc04D6K9LGJ_SgLGbLGO9XtdhvIfuxnmErV6NLVHcgSf-0NXcBFyyliVS3oevf3PYYiiErPvl2ZqAtLZr4VfmAmo4aAyoVZ07ia5JH8MxG6Oz5cghGJ-0Aa81piS7nwEXXDeljxfm1kUx0r6ZxO8TNZ9fAd9HD6GmT6J3h6hpi6KZYWE4mE3V0174a76fy1gHA