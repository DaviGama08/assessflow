if" font-size="14" lengthAdjust="spacing" textLength="3.64" x="1416.6912" y="2613.5793">&#160;</text><text fill="#32658A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="8.4287" x="1267.2418" y="2632.6472">&#9472;</text><text fill="#20242A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="3.64" x="1275.6705" y="2632.6472">&#160;</text><text fill="#254C69" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="34.4119" x="1282.9505" y="2632.6472">HTTP</text><text fill="#20242A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="3.64" x="1321.0023" y="2632.6472">&#160;</text><text fill="#38734D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="8.4287" x="1267.2418" y="2651.7151">&#9472;</text><text fill="#20242A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="3.64" x="1275.6705" y="2651.7151">&#160;</text><text fill="#285237" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="41.8598" x="1282.9505" y="2651.7151">Dados</text><text fill="#20242A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="3.64" x="1328.4503" y="2651.7151">&#160;</text><text fill="#71549A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="8.4287" x="1267.2418" y="2670.783">&#9472;</text><text fill="#20242A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="3.64" x="1275.6705" y="2670.783">&#160;</text><text fill="#594177" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="47.5718" x="1282.9505" y="2670.783">STOMP</text><text fill="#20242A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="3.64" x="1334.1623" y="2670.783">&#160;</text><line style="stroke:none;stroke-width:1;" x1="1263.6018" x2="1420.3312" y1="2465.1379" y2="2465.1379"/><line style="stroke:none;stroke-width:1;" x1="1263.6018" x2="1420.3312" y1="2484.2058" y2="2484.2058"/><line style="stroke:none;stroke-width:1;" x1="1263.6018" x2="1420.3312" y1="2503.2738" y2="2503.2738"/><line style="stroke:none;stroke-width:1;" x1="1263.6018" x2="1420.3312" y1="2522.3417" y2="2522.3417"/><line style="stroke:none;stroke-width:1;" x1="1263.6018" x2="1420.3312" y1="2541.4096" y2="2541.4096"/><line style="stroke:none;stroke-width:1;" x1="1263.6018" x2="1420.3312" y1="2560.4775" y2="2560.4775"/><line style="stroke:none;stroke-width:1;" x1="1263.6018" x2="1420.3312" y1="2579.5454" y2="2579.5454"/><line style="stroke:none;stroke-width:1;" x1="1263.6018" x2="1420.3312" y1="2598.6133" y2="2598.6133"/><line style="stroke:none;stroke-width:1;" x1="1263.6018" x2="1420.3312" y1="2617.6813" y2="2617.6813"/><line style="stroke:none;stroke-width:1;" x1="1263.6018" x2="1420.3312" y1="2636.7492" y2="2636.7492"/><line style="stroke:none;stroke-width:1;" x1="1263.6018" x2="1420.3312" y1="2655.8171" y2="2655.8171"/><line style="stroke:none;stroke-width:1;" x1="1263.6018" x2="1420.3312" y1="2674.885" y2="2674.885"/><line style="stroke:none;stroke-width:1;" x1="1263.6018" x2="1263.6018" y1="2465.1379" y2="2674.885"/><line style="stroke:none;stroke-width:1;" x1="1420.3312" x2="1420.3312" y1="2465.1379" y2="2674.885"/></g><g class="caption" data-source-line="76"><text fill="#20242A" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="116.9416" x="232.6993" y="2710.8509">Pools diferentes:</text><text fill="#20242A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="851.3511" x="353.2809" y="2710.8509">Tomcat e canais STOMP executam tarefas; HikariCP gere liga&#231;&#245;es ao banco. Tamanhos de threads n&#227;o personalizados no projeto.</text><text fill="#20242A" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="39.7039" x="265.1509" y="2729.9189">HTTP:</text><text fill="#20242A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="863.6854" x="308.4948" y="2729.9189">resposta JSON regressa pelo percurso Servlet. Filtros selecionados; LocalPackageSizeFilter aplica-se apenas a importa&#231;&#227;o Local Live.</text><text fill="#20242A" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="81.2697" x="263.3171" y="2748.9868">WebSocket:</text><text fill="#20242A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="825.7874" x="348.2267" y="2748.9868">apenas a abertura passa por HTTP; frames posteriores usam o canal persistente. Criar a sess&#227;o no banco continua a ser REST.</text><text fill="#20242A" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="82.6137" x="262.2461" y="2768.0547">Transa&#231;&#245;es:</text><text fill="#20242A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="826.5852" x="348.4998" y="2768.0547">JPA open-in-view=false. O listener AFTER_COMMIT e brokerChannel n&#227;o ganham um pool pr&#243;prio sem configura&#231;&#227;o adicional.</text><text fill="#20242A" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="81.2977" x="293.179" y="2787.1226">Transporte:</text><text fill="#20242A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="766.0355" x="378.1167" y="2787.1226">HTTP pode reutilizar TCP. TLS pode terminar num proxy externo; o diagrama n&#227;o fixa uma topologia de deployment.</text></g><?plantuml-src fLdRRXkv6RxNKt3LNjZfHh8SsqcSfbXP6iSER4lHA1iK261GCxJCU8QS9Jbol4M0Nkq35Fi03VPYqG9x5HIzhzuaJzB_9pa77UAeA13058VypuVlPxxX8ahoc94_zlRQlRtBdampAPWmVsfyKtngjThkNypfLD7quGqtRSFIBA66wNOi8rryqcrjxXBOZFPQMPucZORX9c6agpNJ-ZYHj-JpNtycCwRq_1T9Tib__at2J74n9KTI6f99HMBWhcJZhFldmUlnvNWmlEmFtbniRJVq3HSP1Iv4o9Xfbf7zdTgcek86Dm_s6urk70S9Iu7Ic4wtcYVZyP2qoVdtlUQtvFUJQKycKZrl_gxV2uwEktPFgfYfOl_Hxi7-4xj_9OKfTdTtTlTskytjPUeNR3h_5749768QIxt48pZU2VRMy7Zo-D5UVrCURzWabD4DCy0a70_EXuj