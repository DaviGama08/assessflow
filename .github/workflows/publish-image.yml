name: Publish image
on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  packages: write
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          sha="${{ github.event.workflow_run.head_sha || github.sha }}"
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/${owner}/assessflow-backend"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "tags=${image}:${sha}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        id: push
        with:
          context: backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            REVISION=${{ steps.meta.outputs.sha }}
            SOURCE=https://github.com/${{ github.repository }}
          provenance: true
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.meta.outputs.tags }}
          format: table
          exit-code: '1'
          severity: CRITICAL
          ignore-unfixed: true
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.meta.outputs.tags }}
          format: cyclonedx
          output: sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: assessflow-backend-sbom
          path: sbom.cdx.json
      - run: |
          echo "commit=${{ steps.meta.outputs.sha }}"
          echo "image=${{ steps.meta.outputs.tags }}"
          echo "digest=${{ steps.push.outputs.digest }}"
  deploy:
    needs: publish
    if: vars.AZURE_CONTAINER_APP_NAME != ''
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Update Container App
        env:
          APP: ${{ vars.AZURE_CONTAINER_APP_NAME }}
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
          IMAGE: ${{ needs.publish.outputs.image }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          set -euo pipefail
          az containerapp registry set --name "$APP" --resource-group "$RG" \
            --server ghcr.io --username "${{ github.actor }}" --password "${{ secrets.GITHUB_TOKEN }}" || true
          az containerapp update --name "$APP" --resource-group "$RG" --image "$IMAGE"
          echo "Deployed $IMAGE digest=$DIGEST"
