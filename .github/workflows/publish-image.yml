name: Publish image
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  packages: write
jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      image: ${{ steps.meta.outputs.tags }}
      deploy: ${{ steps.refs.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          sha="${{ github.event.workflow_run.head_sha }}"
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/${owner}/assessflow-backend"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "tags=${image}:${sha}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        id: push
        with:
          context: backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            REVISION=${{ steps.meta.outputs.sha }}
            SOURCE=https://github.com/${{ github.repository }}
          provenance: true
      - name: Pull image for scan
        run: docker pull ${{ steps.meta.outputs.tags }}
      - name: Trivy CRITICAL
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.67.2 image --exit-code 1 --severity CRITICAL --ignore-unfixed \
            ${{ steps.meta.outputs.tags }}
      - name: CycloneDX SBOM
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/out" \
            aquasec/trivy:0.67.2 image --format cyclonedx --output /out/sbom.cdx.json \
            ${{ steps.meta.outputs.tags }}
      - uses: actions/upload-artifact@v4
        with:
          name: assessflow-backend-sbom
          path: sbom.cdx.json
      - id: refs
        run: |
          digest="${{ steps.push.outputs.digest }}"
          image="${{ steps.meta.outputs.image }}"
          deploy="${image}@${digest}"
          echo "deploy=${deploy}" >> "$GITHUB_OUTPUT"
          echo "commit=${{ steps.meta.outputs.sha }}"
          echo "image=${{ steps.meta.outputs.tags }}"
          echo "digest=${digest}"
          echo "deploy=${deploy}"
  deploy:
    needs: publish
    if: vars.AZURE_CONTAINER_APP_NAME != ''
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Update Container App
        env:
          APP: ${{ vars.AZURE_CONTAINER_APP_NAME }}
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
          IMAGE: ${{ needs.publish.outputs.deploy }}
        run: |
          set -euo pipefail
          az containerapp update --name "$APP" --resource-group "$RG" --image "$IMAGE"
          echo "Deployed $IMAGE"
