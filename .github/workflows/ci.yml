name: CI
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: ./mvnw clean verify
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run format:check
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run test
        working-directory: frontend
      - run: VITE_SAME_ORIGIN=true npm run build
        working-directory: frontend
  container:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: assessflow
          POSTGRES_USER: assessflow
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U assessflow -d assessflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg REVISION=${{ github.sha }} -t assessflow-backend:${{ github.sha }} .
        working-directory: backend
      - name: Smoke liveness and non-root user
        run: |
          docker run -d --name assessflow-api --network host \
            -e SPRING_PROFILES_ACTIVE=local \
            -e DB_URL=jdbc:postgresql://127.0.0.1:5432/assessflow \
            -e DB_USERNAME=assessflow \
            -e DB_PASSWORD=test \
            -e APP_CORS_ALLOWED_ORIGINS=http://127.0.0.1:8080 \
            assessflow-backend:${{ github.sha }}
          user=$(docker inspect assessflow-api --format '{{.Config.User}}')
          test "$user" = "10001"
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8080/actuator/health/liveness | grep -q UP; then
              curl -fsS http://127.0.0.1:8080/actuator/health/readiness
              exit 0
            fi
            sleep 3
          done
          docker logs assessflow-api
          exit 1
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: assessflow
          POSTGRES_USER: assessflow
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U assessflow -d assessflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: ./mvnw -B -DskipTests package
        working-directory: backend
      - name: Start API
        run: |
          java -jar backend/target/assessflow-backend-0.1.0.jar \
            --spring.profiles.active=local \
            --spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/assessflow \
            --spring.datasource.username=assessflow \
            --spring.datasource.password=test \
            --app.cors.allowed-origins=http://127.0.0.1:4173 \
            --app.ws.allowed-origins=http://127.0.0.1:4173 \
            --app.auth.secure-cookie=false \
            --server.port=8080 > api.log 2>&1 &
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:8080/actuator/health/liveness && exit 0
            sleep 3
          done
          cat api.log
          exit 1
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: VITE_SAME_ORIGIN=true VITE_API_BASE_URL=http://127.0.0.1:8080/api/v1 VITE_PUBLIC_APP_URL=http://127.0.0.1:4173 VITE_WS_URL=ws://127.0.0.1:8080/ws npm run build
        working-directory: frontend
      - run: E2E_API_URL=http://127.0.0.1:8080/api/v1 npm run test:e2e
        working-directory: frontend
