server:
  address: ${LOCAL_LIVE_BIND:0.0.0.0}
  port: ${LOCAL_LIVE_PORT:8080}
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:55432/assessflow}
    username: ${DB_USERNAME:assessflow_local}
    password: ${DB_PASSWORD:local_only_change_me}
app:
  auth:
    secure-cookie: false
    refresh-cookie:
      same-site: Strict
  api-docs:
    enabled: false
  cors:
    allowed-origins: "${APP_CORS_ALLOWED_ORIGINS:http://localhost:${server.port}},http://localhost:${server.port},http://127.0.0.1:${server.port},http://${LOCAL_LIVE_HOST:localhost}:${server.port}"
  ws:
    allow-private-lan: true
  local-live:
    host: ${LOCAL_LIVE_HOST:}
    enabled: true
  realtime:
    broker-mode: simple
  redis:
    enabled: false
logging:
  level:
    com.davigama.assessflow.locallive: INFO
