server:
  shutdown: graceful
  # Do not trust client-supplied forwarded headers. Use app.http.proxy-mode=forwarded|cloudflare
  # only when the origin cannot be reached except through the configured edge.
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:none}
spring:
  application:
    name: assessflow
  profiles:
    default: local
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:30s}
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
app:
  auth:
    secure-cookie: ${APP_AUTH_SECURE_COOKIE:true}
    refresh-cookie:
      same-site: ${APP_AUTH_REFRESH_COOKIE_SAME_SITE:Strict}
  live:
    participant-token-ttl: ${APP_LIVE_PARTICIPANT_TOKEN_TTL:12h}
  local-package:
    max-questions: ${APP_LOCAL_PACKAGE_MAX_QUESTIONS:200}
    max-options-per-question: ${APP_LOCAL_PACKAGE_MAX_OPTIONS:20}
    max-payload-bytes: ${APP_LOCAL_PACKAGE_MAX_BYTES:2097152}
  realtime:
    broker-mode: ${APP_REALTIME_BROKER_MODE:simple}
    relay:
      host: ${RABBITMQ_HOST:}
      port: ${RABBITMQ_STOMP_PORT:61613}
      username: ${RABBITMQ_USERNAME:}
      password: ${RABBITMQ_PASSWORD:}
      virtual-host: ${RABBITMQ_VHOST:/}
  redis:
    enabled: ${APP_REDIS_ENABLED:false}
    host: ${REDIS_HOST:}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
  http:
    proxy-mode: ${APP_HTTP_PROXY_MODE:none}
    trusted-proxy: ${APP_HTTP_TRUSTED_PROXY:false}
  deploy:
    replicas: ${APP_REPLICAS:1}
  api-docs:
    enabled: ${APP_API_DOCS_ENABLED:false}
  rate-limit:
    join-per-minute: ${APP_RATE_LIMIT_JOIN:30}
    preview-per-minute: ${APP_RATE_LIMIT_PREVIEW:60}
    auth-per-minute: ${APP_RATE_LIMIT_AUTH:20}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: ping,livenessState
        readiness:
          include: ping,readinessState,db
  health:
    redis:
      enabled: false
  tracing:
    enabled: false
  prometheus:
    metrics:
      export:
        enabled: false
springdoc:
  api-docs:
    enabled: ${app.api-docs.enabled:false}
  swagger-ui:
    enabled: ${app.api-docs.enabled:false}
