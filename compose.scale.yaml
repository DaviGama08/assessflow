# Optional scaled dependencies. Default compose.yaml and Local Live stay PostgreSQL-only.
services:
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    ports:
      - "127.0.0.1:${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_STOMP_PORT:-61613}:61613"
      - "127.0.0.1:${RABBITMQ_MGMT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-assessflow}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-change_me_not_guest}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    command:
      - bash
      - -c
      - rabbitmq-plugins enable --offline rabbitmq_stomp rabbitmq_management && rabbitmq-server
