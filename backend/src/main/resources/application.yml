spring:
  application:
    name: distributed-quiz
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/distributed_quiz}
    username: ${DB_USERNAME:quiz_local}
    password: ${DB_PASSWORD:local_only_change_me}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
