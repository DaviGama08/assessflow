spring:
  application:
    name: assessflow
  profiles:
    default: local
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
app:
  auth:
    secure-cookie: true
  live:
    participant-token-ttl: ${APP_LIVE_PARTICIPANT_TOKEN_TTL:12h}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
