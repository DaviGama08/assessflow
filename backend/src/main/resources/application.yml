spring:
  application:
    name: assessflow
  profiles:
    default: local
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
app:
  auth:
    secure-cookie: true
  live:
    participant-token-ttl: ${APP_LIVE_PARTICIPANT_TOKEN_TTL:12h}
  local-package:
    max-questions: ${APP_LOCAL_PACKAGE_MAX_QUESTIONS:200}
    max-options-per-question: ${APP_LOCAL_PACKAGE_MAX_OPTIONS:20}
    max-payload-bytes: ${APP_LOCAL_PACKAGE_MAX_BYTES:2097152}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
