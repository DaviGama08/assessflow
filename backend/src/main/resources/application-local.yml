spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:55432/assessflow}
    username: ${DB_USERNAME:assessflow_local}
    password: ${DB_PASSWORD:local_only_change_me}
app:
  auth:
    secure-cookie: ${APP_AUTH_SECURE_COOKIE:false}
    refresh-cookie:
      same-site: Strict
  api-docs:
    enabled: true
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  realtime:
    broker-mode: simple
  redis:
    enabled: false
